# Testomgeving (Coolify): zelfde app, eigen database en eigen geheimen, zonder routeringsdienst.
# Zoekt standaard NIET op Marktplaats (WORKER_SCRAPING=off) zodat de productie-omgeving geen extra belasting of blokkade krijgt;
# zet WORKER_SCRAPING=on in Coolify om echte advertenties te laten binnenkomen.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD}
      POSTGRES_DB: dealhunter
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealhunter"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      DATABASE_URL: postgresql://dealhunter:${POSTGRES_PASSWORD}@db:5432/dealhunter
      APP_SECRET: ${APP_SECRET:?zet APP_SECRET}
      CRON_SECRET: ${CRON_SECRET:-}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-5}
      WORKER_SCRAPING: ${WORKER_SCRAPING:-off}
    expose: ["3000"]

  worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on: { web: { condition: service_started } }
    environment: *env
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker"]
    healthcheck:
      test: ["CMD", "npx", "tsx", "scripts/worker-health.ts"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  dbdata:
