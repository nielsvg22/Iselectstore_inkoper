services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealhunter}
      POSTGRES_DB: dealhunter
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealhunter"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      DATABASE_URL: postgresql://dealhunter:${POSTGRES_PASSWORD:-dealhunter}@db:5432/dealhunter
      APP_SECRET: ${APP_SECRET:?zet APP_SECRET in .env (openssl rand -hex 32)}
      CRON_SECRET: ${CRON_SECRET:-}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-}
    expose: ["3000"]

  worker:
    build: .
    restart: unless-stopped
    depends_on: { web: { condition: service_started } }
    environment: *env
    command: ["npm", "run", "worker"]

volumes:
  dbdata:
