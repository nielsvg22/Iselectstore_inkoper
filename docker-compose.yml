services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealhunter}
      POSTGRES_DB: dealhunter
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealhunter"]
      interval: 5s
      retries: 10

  routing:
    build: ./routing
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    expose: ["5000"]

  web:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      DATABASE_URL: postgresql://dealhunter:${POSTGRES_PASSWORD:-dealhunter}@db:5432/dealhunter
      APP_SECRET: ${APP_SECRET:?zet APP_SECRET in .env (openssl rand -hex 32)}
      CRON_SECRET: ${CRON_SECRET:-}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ROUTING_URL: http://routing:5000
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-5}
    expose: ["3000"]

  worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on: { web: { condition: service_started } }
    environment: *env
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker"]
    healthcheck:
      test: ["CMD", "npx", "tsx", "scripts/worker-health.ts"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  dbdata:
